<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="50%" stop-color="#0b0814" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)" />

  <!-- Audio Waveform Visualization -->
  <g opacity="0.85">
    <path d="M 100 240 Q 200 120, 300 240 T 500 240 T 700 240" fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 120 250 Q 220 180, 320 250 T 520 250 T 720 250" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 80 230 Q 180 80, 280 230 T 480 230 T 680 230" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Sound Equalizer Bars Floating -->
  <g transform="translate(300, 160)">
    <rect x="0" y="40" width="6" height="50" rx="3" fill="#ec4899" />
    <rect x="15" y="20" width="6" height="90" rx="3" fill="#a855f7" />
    <rect x="30" y="5" width="6" height="120" rx="3" fill="#ffffff" />
    <rect x="45" y="30" width="6" height="70" rx="3" fill="#8b5cf6" />
    <rect x="60" y="10" width="6" height="110" rx="3" fill="#6366f1" />
    <rect x="75" y="45" width="6" height="40" rx="3" fill="#3b82f6" />
    <rect x="90" y="15" width="6" height="100" rx="3" fill="#06b6d4" />
    <rect x="105" y="35" width="6" height="60" rx="3" fill="#ec4899" />
    <rect x="120" y="55" width="6" height="20" rx="3" fill="#a855f7" />
    <rect x="135" y="25" width="6" height="80" rx="3" fill="#ffffff" />
    <rect x="150" y="40" width="6" height="50" rx="3" fill="#8b5cf6" />
    <rect x="165" y="15" width="6" height="100" rx="3" fill="#3b82f6" />
    <rect x="180" y="30" width="6" height="70" rx="3" fill="#06b6d4" />
  </g>

  <!-- Editorial Info -->
  <text x="50" y="60" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a0a0a0">CASE STUDY / 03</text>
  <text x="750" y="60" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#ec4899" text-anchor="end">FWA OF THE DAY</text>
  <text x="50" y="450" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">Aura Spatial Sound</text>
  <text x="50" y="475" font-family="sans-serif" font-size="12" font-weight="500" fill="#888888" letter-spacing="1">Acoustic Audio Systems &amp; Hardware Companion App</text>
</svg>
