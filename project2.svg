<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p2Badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="360" rx="12" fill="url(#p2Bg)" />
  
  <!-- Outer App Card Container -->
  <rect x="50" y="30" width="500" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- App Top Bar with Question Count and Timer -->
  <text x="80" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">QUESTION 3 OF 5</text>
  <rect x="420" y="48" width="95" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <circle cx="435" cy="61" r="5" fill="#38bdf8" />
  <text x="448" y="66" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">00:45s</text>
  
  <!-- Progress Bar -->
  <rect x="80" y="82" width="440" height="6" rx="3" fill="#1e293b" />
  <rect x="80" y="82" width="264" height="6" rx="3" fill="url(#p2Badge)" />
  
  <!-- Question Title -->
  <text x="80" y="125" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Which HTML tag is used to embed JavaScript code?</text>
  
  <!-- Option 1 (Normal) -->
  <rect x="80" y="145" width="440" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="102" cy="163" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <text x="125" y="168" fill="#cbd5e1" font-family="monospace" font-size="13">&lt;javascript&gt;</text>
  
  <!-- Option 2 (Correct Selected) -->
  <rect x="80" y="190" width="440" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <circle cx="102" cy="208" r="8" fill="#10b981" />
  <path d="M98 208 L101 211 L106 205" fill="none" stroke="#ffffff" stroke-width="2" />
  <text x="125" y="213" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">&lt;script&gt; (Correct)</text>
  
  <!-- Option 3 (Normal) -->
  <rect x="80" y="235" width="440" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="102" cy="253" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <text x="125" y="258" fill="#cbd5e1" font-family="monospace" font-size="13">&lt;js&gt;</text>
  
  <!-- Footer Action Button -->
  <rect x="410" y="285" width="110" height="32" rx="6" fill="#38bdf8" />
  <text x="465" y="306" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Next →</text>
</svg>
