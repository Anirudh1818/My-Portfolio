<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="klBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#klBg)" />

  <!-- Background Watermark -->
  <text x="400" y="260" font-family="'Syne', 'Inter', sans-serif" font-size="110" font-weight="900" fill="#ffffff" fill-opacity="0.03" text-anchor="middle" letter-spacing="16">KREALINK</text>

  <!-- Marketplace Dashboard Window -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="600" height="310" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b" />
    <circle cx="28" cy="21" r="5" fill="#ef4444" />
    <circle cx="44" cy="21" r="5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="300" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">krealink.ai — AI Creator Marketplace &bull; Match Engine</text>

    <!-- Left Card: Creator Match Profile -->
    <rect x="25" y="65" width="260" height="215" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="65" cy="105" r="24" fill="#3b82f6" />
    <text x="65" y="112" font-family="'Syne', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AI</text>
    <text x="105" y="102" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Aura GenStudio</text>
    <text x="105" y="118" font-family="sans-serif" font-size="10" font-weight="500" fill="#10b981">● 98.4% Match Score</text>

    <!-- Signal Bars -->
    <text x="40" y="152" font-family="sans-serif" font-size="9" font-weight="600" fill="#9ca3af">STYLE RELEVANCE</text>
    <rect x="40" y="158" width="230" height="6" rx="3" fill="#374151" />
    <rect x="40" y="158" width="215" height="6" rx="3" fill="url(#aiGlow)" />

    <text x="40" y="182" font-family="sans-serif" font-size="9" font-weight="600" fill="#9ca3af">HISTORIC ENGAGEMENT</text>
    <rect x="40" y="188" width="230" height="6" rx="3" fill="#374151" />
    <rect x="40" y="188" width="195" height="6" rx="3" fill="#38bdf8" />

    <text x="40" y="212" font-family="sans-serif" font-size="9" font-weight="600" fill="#9ca3af">DELIVERY SPEED (AVG 24H)</text>
    <rect x="40" y="218" width="230" height="6" rx="3" fill="#374151" />
    <rect x="40" y="218" width="220" height="6" rx="3" fill="#10b981" />

    <rect x="40" y="240" width="110" height="26" rx="6" fill="#6366f1" />
    <text x="95" y="257" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Assign Brief</text>

    <!-- Right Card: Escrow & Security Rules Verification -->
    <rect x="315" y="65" width="260" height="215" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <text x="335" y="96" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Razorpay Escrow &amp; Security</text>
    <rect x="335" y="112" width="220" height="38" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="350" y="130" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">HMAC-SHA256 VERIFIED</text>
    <text x="350" y="142" font-family="sans-serif" font-size="9" font-weight="500" fill="#a7f3d0">Payout Locked &bull; Automated Release</text>

    <!-- Code Block / Security Rules -->
    <rect x="335" y="162" width="220" height="98" rx="6" fill="#030712" stroke="#1f2937" stroke-width="1" />
    <text x="345" y="180" font-family="monospace" font-size="9" fill="#f43f5e">match /campaigns/{id} {</text>
    <text x="355" y="196" font-family="monospace" font-size="9" fill="#38bdf8">  allow write: if isBrand();</text>
    <text x="355" y="212" font-family="monospace" font-size="9" fill="#10b981">  // 600+ Lines Rules Tests</text>
    <text x="345" y="228" font-family="monospace" font-size="9" fill="#f43f5e">}</text>
  </g>

  <!-- Editorial Card Meta -->
  <text x="50" y="55" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#94a3b8">HACKATHON WINNER / 01</text>
  <text x="750" y="55" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#ec4899" text-anchor="end">1ST PLACE &bull; HACXLERATE '26</text>
  <text x="50" y="445" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">KreaLink — AI-Creator Marketplace</text>
  <text x="50" y="470" font-family="sans-serif" font-size="12" font-weight="500" fill="#9ca3af" letter-spacing="1">Next.js 16 &bull; TypeScript &bull; Firebase Security Rules &bull; Razorpay &bull; Gemini API</text>
</svg>
