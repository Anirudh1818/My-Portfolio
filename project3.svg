<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="cardHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="360" rx="12" fill="url(#p3Bg)" />

  <!-- Main Website Mockup -->
  <rect x="40" y="30" width="520" height="300" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />

  <!-- Navbar -->
  <rect x="40" y="30" width="520" height="40" rx="10" fill="#1e293b" />
  <circle cx="68" cy="50" r="10" fill="#38bdf8" />
  <text x="88" y="55" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">ProductLaunch</text>
  <rect x="360" y="44" width="45" height="12" rx="3" fill="#64748b" />
  <rect x="415" y="44" width="45" height="12" rx="3" fill="#64748b" />
  <rect x="470" y="40" width="70" height="20" rx="4" fill="#6366f1" />

  <!-- Hero Text -->
  <rect x="180" y="90" width="240" height="18" rx="4" fill="#ffffff" />
  <rect x="150" y="115" width="300" height="10" rx="3" fill="#64748b" />

  <!-- 3 Pricing Cards Grid -->
  <!-- Card 1: Starter -->
  <rect x="70" y="145" width="135" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="90" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">STARTER</text>
  <text x="90" y="198" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">$0</text>
  <rect x="90" y="215" width="95" height="6" rx="2" fill="#475569" />
  <rect x="90" y="228" width="80" height="6" rx="2" fill="#475569" />
  <rect x="90" y="241" width="90" height="6" rx="2" fill="#475569" />
  <rect x="85" y="260" width="105" height="24" rx="4" fill="#334155" />

  <!-- Card 2: Pro (Featured) -->
  <rect x="232" y="135" width="136" height="175" rx="8" fill="#1e1e38" stroke="#6366f1" stroke-width="2" />
  <rect x="265" y="130" width="70" height="16" rx="8" fill="#6366f1" />
  <text x="300" y="142" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">POPULAR</text>
  <text x="250" y="168" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">PRO PLAN</text>
  <text x="250" y="198" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">$19</text>
  <rect x="250" y="215" width="100" height="6" rx="2" fill="#818cf8" />
  <rect x="250" y="228" width="85" height="6" rx="2" fill="#818cf8" />
  <rect x="250" y="241" width="95" height="6" rx="2" fill="#818cf8" />
  <rect x="245" y="265" width="110" height="26" rx="4" fill="url(#cardHighlight)" />

  <!-- Card 3: Enterprise -->
  <rect x="395" y="145" width="135" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="415" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">ENTERPRISE</text>
  <text x="415" y="198" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">$49</text>
  <rect x="415" y="215" width="95" height="6" rx="2" fill="#475569" />
  <rect x="415" y="228" width="75" height="6" rx="2" fill="#475569" />
  <rect x="415" y="241" width="90" height="6" rx="2" fill="#475569" />
  <rect x="410" y="260" width="105" height="24" rx="4" fill="#334155" />
</svg>
