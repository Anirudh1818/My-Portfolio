<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)" />

  <!-- Architectural Minimalist Grid & Shadows -->
  <g transform="translate(180, 110)">
    <!-- Arch 1 -->
    <path d="M 0 250 L 0 80 A 60 60 0 0 1 120 80 L 120 250 Z" fill="#27272a" stroke="#52525b" stroke-width="2" />
    <!-- Arch 2 -->
    <path d="M 160 250 L 160 60 A 80 80 0 0 1 320 60 L 320 250 Z" fill="#3f3f46" stroke="#71717a" stroke-width="2" />
    <!-- Pillar 3 -->
    <rect x="360" y="30" width="80" height="220" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Diagonal Shadow Line -->
    <line x1="-30" y1="20" x2="480" y2="250" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  </g>

  <!-- Editorial Info -->
  <text x="50" y="60" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a0a0a0">CASE STUDY / 04</text>
  <text x="750" y="60" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#ffffff" text-anchor="end">EXHIBITION 2026</text>
  <text x="50" y="450" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">Atelier Lumière</text>
  <text x="50" y="475" font-family="sans-serif" font-size="12" font-weight="500" fill="#888888" letter-spacing="1">Architectural Exhibition &amp; Photographic Archival CMS</text>
</svg>
