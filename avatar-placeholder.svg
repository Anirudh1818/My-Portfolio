<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Circular Background -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Soft Glow Filter Accent -->
  <circle cx="160" cy="160" r="135" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Avatar Head -->
  <circle cx="160" cy="120" r="50" fill="url(#avatarGrad)" />

  <!-- Hair / Header Detail -->
  <path d="M115 125 C115 80, 205 80, 205 125 C195 105, 175 98, 160 98 C145 98, 125 105, 115 125 Z" fill="#334155" />

  <!-- Glasses / Minimalist Tech Accent -->
  <rect x="132" y="115" width="22" height="14" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2.5" />
  <rect x="166" y="115" width="22" height="14" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2.5" />
  <line x1="154" y1="122" x2="166" y2="122" stroke="#e2e8f0" stroke-width="2.5" />

  <!-- Shoulders & Torso -->
  <path d="M75 265 C75 200, 110 185, 160 185 C210 185, 245 200, 245 265 C220 282, 190 292, 160 292 C130 292, 100 282, 75 265 Z" fill="url(#avatarGrad)" />

  <!-- Collar / Shirt Detail -->
  <path d="M140 185 L160 215 L180 185 Z" fill="#1e293b" />
  <polygon points="160,215 148,275 172,275" fill="#38bdf8" opacity="0.85" />
</svg>
