<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c10" />
      <stop offset="50%" stop-color="#0a0507" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad6)" />

  <!-- Magazine Editorial Typography -->
  <text x="400" y="240" font-family="'Didot', 'Playfair Display', Georgia, serif" font-size="140" font-weight="900" fill="#ffffff" fill-opacity="0.12" text-anchor="middle" letter-spacing="12">VOGUE</text>

  <!-- Editorial Model Frame -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="280" height="260" fill="none" stroke="#e11d48" stroke-width="2" />
    <rect x="20" y="20" width="240" height="220" fill="#260b13" />
    <!-- High-Fashion Silhouette Art -->
    <path d="M 120 40 Q 140 30, 160 40 Q 170 70, 140 100 Q 110 70, 120 40 Z" fill="#f43f5e" />
    <path d="M 80 180 L 140 90 L 200 180 Z" fill="#881337" opacity="0.9" />
    <line x1="140" y1="180" x2="140" y2="230" stroke="#f43f5e" stroke-width="3" />
  </g>

  <!-- Editorial Info -->
  <text x="50" y="60" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a0a0a0">CASE STUDY / 06</text>
  <text x="750" y="60" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#f43f5e" text-anchor="end">PARIS FASHION WEEK</text>
  <text x="50" y="450" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">Vogue Runway Archive</text>
  <text x="50" y="475" font-family="sans-serif" font-size="12" font-weight="500" fill="#888888" letter-spacing="1">Interactive Haute Couture Showcase &amp; Motion Direction</text>
</svg>
