<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="360" rx="12" fill="url(#p1Bg)" />
  
  <!-- Browser Window Frame -->
  <rect x="40" y="30" width="520" height="300" rx="10" fill="#020617" stroke="#334155" stroke-width="2" />
  
  <!-- Window Header Bar -->
  <rect x="40" y="30" width="520" height="36" rx="10" fill="#1e293b" />
  <circle cx="65" cy="48" r="6" fill="#ef4444" />
  <circle cx="85" cy="48" r="6" fill="#f59e0b" />
  <circle cx="105" cy="48" r="6" fill="#10b981" />
  <rect x="140" y="40" width="280" height="16" rx="4" fill="#0f172a" />
  <text x="280" y="52" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">portfolio.dev</text>
  
  <!-- Content Area -->
  <rect x="70" y="90" width="180" height="24" rx="4" fill="url(#p1Accent)" />
  <rect x="70" y="125" width="240" height="12" rx="3" fill="#475569" />
  <rect x="70" y="145" width="200" height="12" rx="3" fill="#334155" />
  
  <!-- Buttons -->
  <rect x="70" y="175" width="90" height="28" rx="6" fill="#38bdf8" />
  <rect x="170" y="175" width="90" height="28" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" />
  
  <!-- Hero Graphic Illustration in window -->
  <circle cx="440" cy="150" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M410 190 C410 160, 470 160, 470 190 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="440" cy="135" r="22" fill="#e2e8f0" />
  
  <!-- Code Snippet Box -->
  <rect x="70" y="225" width="460" height="85" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="85" y="248" fill="#38bdf8" font-family="monospace" font-size="12">&lt;<tspan fill="#f43f5e">header</tspan>&gt;</text>
  <text x="100" y="270" fill="#94a3b8" font-family="monospace" font-size="12">&lt;<tspan fill="#f59e0b">h1</tspan>&gt;Welcome to My Portfolio&lt;/<tspan fill="#f59e0b">h1</tspan>&gt;</text>
  <text x="85" y="292" fill="#38bdf8" font-family="monospace" font-size="12">&lt;/<tspan fill="#f43f5e">header</tspan>&gt;</text>
