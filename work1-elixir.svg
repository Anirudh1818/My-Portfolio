<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6ca65" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b89326" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)" />
  <circle cx="400" cy="250" r="280" fill="url(#goldGlow)" />

  <!-- Editorial Typography Watermark -->
  <text x="400" y="270" font-family="'Syne', 'Playfair Display', Georgia, serif" font-size="120" font-weight="900" fill="#ffffff" fill-opacity="0.04" text-anchor="middle" letter-spacing="15">ÉLIXIR</text>

  <!-- Perfume Bottle Silhouette -->
  <!-- Cap -->
  <rect x="365" y="110" width="70" height="45" rx="3" fill="#1c1c1c" stroke="#d4af37" stroke-width="1.5" />
  <rect x="385" y="155" width="30" height="15" fill="#d4af37" />

  <!-- Glass Bottle Body -->
  <rect x="320" y="170" width="160" height="230" rx="8" fill="#111111" fill-opacity="0.85" stroke="url(#bottleGrad)" stroke-width="2" />
  <line x1="335" y1="185" x2="335" y2="385" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="465" y1="185" x2="465" y2="385" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />

  <!-- Bottle Label -->
  <rect x="345" y="240" width="110" height="85" fill="#f8f8f8" />
  <text x="400" y="265" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#111111" text-anchor="middle">PARIS</text>
  <text x="400" y="285" font-family="serif" font-size="14" font-weight="900" letter-spacing="2" fill="#111111" text-anchor="middle">L'ÉLIXIR</text>
  <line x1="375" y1="295" x2="425" y2="295" stroke="#d4af37" stroke-width="1" />
  <text x="400" y="310" font-family="sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#777777" text-anchor="middle">EAU DE PARFUM</text>

  <!-- Brand Elements -->
  <text x="50" y="60" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a0a0a0">CASE STUDY / 01</text>
  <text x="750" y="60" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#d4af37" text-anchor="end">AWWWARDS SOTD</text>
  <text x="50" y="450" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">L'Élixir de Paris</text>
  <text x="50" y="475" font-family="sans-serif" font-size="12" font-weight="500" fill="#888888" letter-spacing="1">Immersive 3D Experience &amp; Digital Boutique</text>
</svg>
