<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <radialGradient id="blueDial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" />
  <circle cx="400" cy="240" r="240" fill="url(#blueDial)" />

  <!-- Huge Watermark -->
  <text x="400" y="270" font-family="'Syne', 'Inter', sans-serif" font-size="110" font-weight="900" fill="#ffffff" fill-opacity="0.03" text-anchor="middle" letter-spacing="20">CHRONO</text>

  <!-- Watch Dial Mockup -->
  <!-- Outer Bezel -->
  <circle cx="400" cy="235" r="150" fill="#0b0f19" stroke="#334155" stroke-width="4" />
  <circle cx="400" cy="235" r="144" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="400" cy="235" r="130" fill="#030712" stroke="#1e293b" stroke-width="2" />

  <!-- Hour markers -->
  <line x1="400" y1="115" x2="400" y2="135" stroke="#ffffff" stroke-width="3" />
  <line x1="400" y1="335" x2="400" y2="355" stroke="#ffffff" stroke-width="3" />
  <line x1="280" y1="235" x2="300" y2="235" stroke="#ffffff" stroke-width="3" />
  <line x1="500" y1="235" x2="520" y2="235" stroke="#ffffff" stroke-width="3" />

  <!-- Sub-dial -->
  <circle cx="400" cy="280" r="32" fill="#0b0f19" stroke="#38bdf8" stroke-width="1" />
  <line x1="400" y1="280" x2="415" y2="270" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Watch Hands -->
  <line x1="400" y1="235" x2="445" y2="190" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
  <line x1="400" y1="235" x2="350" y2="175" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="235" x2="400" y2="145" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="400" cy="235" r="6" fill="#f43f5e" />

  <!-- Branding -->
  <text x="400" y="195" font-family="'Syne', sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#ffffff" text-anchor="middle">KRONOS</text>
  <text x="400" y="208" font-family="sans-serif" font-size="6" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="middle">GENÈVE</text>

  <!-- Editorial Info -->
  <text x="50" y="60" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a0a0a0">CASE STUDY / 02</text>
  <text x="750" y="60" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#60a5fa" text-anchor="end">€1.4M LAUNCH</text>
  <text x="50" y="450" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">Kronos Genève</text>
  <text x="50" y="475" font-family="sans-serif" font-size="12" font-weight="500" fill="#888888" letter-spacing="1">Haute Horlogerie Configurator &amp; Motion Architecture</text>
</svg>
